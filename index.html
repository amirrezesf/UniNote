<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سامانه اشتراک جزوات دانشگاهی</title>
  <!-- <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" /> -->
  <link rel="stylesheet" href="assets/fonts/Dana/fonts.css">
  <link rel="stylesheet" href="assets/fonts/Vazir/fonts.css">
  <link rel="stylesheet" href="assets/fonts/Yekan Bk+/font.css">
  <style>
      /* Light mode - pure white background with high contrast */
            :root {
              --bg-primary: #ffffff;        /* page background - pure white */
              --bg-card: #ffffff;           /* cards, modals - pure white */
              --bg-sidebar: #ffffff;        /* sidebar - pure white */
              --bg-elevated: #fafafa;       /* elevated surfaces - subtle off-white */
              --text-primary: #1c1917;      /* near-black text (stone-900) */
              --text-secondary: #57534e;    /* stone-600 */
              --text-muted: #78716c;        /* stone-500 */
              --border: #e7e5e4;            /* stone-200 */
              --border-light: #f5f5f4;      /* stone-100 */
              --hover-bg: #f5f5f4;          /* stone-100 */
              color-scheme: light;
            }

      /* Dark mode - deep, layered neutrals */
      .dark {
        --bg-primary: #0c0a09;        /* page background - stone-950 */
        --bg-card: #1c1917;           /* cards - stone-900 */
        --bg-sidebar: #1c1917;        /* sidebar - stone-900 */
        --bg-elevated: #292524;       /* elevated - stone-800 */
        --text-primary: #fafaf9;      /* stone-50 */
        --text-secondary: #d6d3d1;    /* stone-200 */
        --text-muted: #a8a29e;        /* stone-400 */
        --border: #44403c;            /* stone-700 */
        --border-light: #292524;      /* stone-800 */
        --hover-bg: #292524;          /* stone-800 */
        color-scheme: dark;
      }

    html, body, #root {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Vazir', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body,
    #root {
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    .dark body,
    .dark #root {
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    .dark .bg-white {
      background-color: var(--bg-card) !important;
    }

    .dark .bg-slate-50 {
      background-color: var(--bg-elevated) !important;
    }

    .dark .bg-slate-100 {
      background-color: var(--bg-elevated) !important;
    }

    .dark .bg-gray-50 {
          background-color: var(--bg-elevated) !important;
        }

        .dark .bg-gray-100 {
          background-color: var(--bg-elevated) !important;
        }

        .dark .bg-stone-50 {
          background-color: var(--bg-elevated) !important;
        }

        .dark .bg-stone-100 {
          background-color: var(--bg-elevated) !important;
        }

        .dark .bg-stone-800,
        .dark .bg-stone-900 {
          background-color: var(--bg-card) !important;
        }

        .dark .bg-gray-800,
        .dark .bg-slate-800 {
          background-color: var(--bg-sidebar) !important;
        }

    .dark .border-slate-200,
        .dark .border-slate-100,
        .dark .border-gray-200,
        .dark .border-gray-700,
        .dark .border-stone-200,
        .dark .border-stone-700 {
          border-color: var(--border) !important;
        }

        .dark .border-stone-800,
        .dark .border-stone-900 {
          border-color: var(--border) !important;
        }

        .dark .text-slate-900,
        .dark .text-slate-800,
        .dark .text-slate-700,
        .dark .text-stone-900,
        .dark .text-stone-800,
        .dark .text-stone-700 {
          color: var(--text-primary) !important;
        }

        .dark .text-slate-600,
        .dark .text-slate-500,
        .dark .text-slate-400,
        .dark .text-slate-300,
        .dark .text-slate-200,
        .dark .text-stone-600,
        .dark .text-stone-500,
        .dark .text-stone-400,
        .dark .text-stone-300 {
          color: var(--text-secondary) !important;
        }

        .dark .text-gray-400,
        .dark .text-gray-500,
        .dark .text-gray-600 {
          color: var(--text-muted) !important;
        }

        .dark .text-gray-100,
        .dark .text-gray-200,
        .dark .text-gray-300,
        .dark .text-stone-100,
        .dark .text-stone-200,
        .dark .text-stone-300 {
          color: var(--text-primary) !important;
        }

    .dark .hover\:bg-slate-50:hover {
          background-color: var(--hover-bg) !important;
        }

        .dark .hover\:bg-stone-50:hover,
        .dark .hover\:bg-stone-100:hover {
          background-color: var(--hover-bg) !important;
        }

        .dark .hover\:bg-gray-700:hover {
          background-color: var(--hover-bg) !important;
        }

    /* Smooth transitions for theme changes */
    *, *::before, *::after {
      transition-property: background-color, border-color, color, box-shadow;
      transition-duration: 200ms;
      transition-timing-function: ease;
    }

    /* Exclude transitions from elements that need immediate swaps */
    .no-theme-transition, .no-theme-transition * {
      transition: none !important;
    }

    /* Custom Scrollbar for better aesthetics */
        ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
        }

        ::-webkit-scrollbar-track {
          background: #e7e5e4; /* stone-200 */
        }

        .dark ::-webkit-scrollbar-track {
          background: #292524; /* stone-800 */
        }

        ::-webkit-scrollbar-thumb {
          background: #a8a29e; /* stone-400 */
          border-radius: 4px;
        }

        .dark ::-webkit-scrollbar-thumb {
          background: #78716c; /* stone-500 */
        }

        ::-webkit-scrollbar-thumb:hover {
          background: #78716c; /* stone-500 */
        }

        .dark ::-webkit-scrollbar-thumb:hover {
          background: #a8a29e; /* stone-400 */
        }

    /* Hide scrollbar (used for compact filter/option lists) */
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
  <script>
      // Apply dark class before paint to prevent flash - respects localStorage
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === null && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // Fallback if localStorage unavailable
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script src="tailwind.js"></script>
</body>

</html>
